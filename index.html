function cb(){const t=JSON.stringify(S),b=document.getElementById('bt'),k=document.getElementById('bcm');b.value=t;b.focus();b.select();try{b.setSelectionRange(0,t.length)}catch(e){}const ok=()=>{k.textContent='Copied. Paste it somewhere safe'},ex=()=>{try{document.execCommand('copy')&&ok()}catch(e){}};navigator.clipboard&&navigator.clipboard.writeText?navigator.clipboard.writeText(t).then(ok,ex):ex()}
function rf(i){const f=i.files[0];if(!f)return;const R=new FileReader();R.onload=()=>{bt.value=R.result;rs()};R.readAsText(f)}
function rs(){try{const d=JSON.parse(bt.value);if(!d||!Array.isArray(d.tasks))throw 0;S=Object.assign({tasks:[],recipes:[],notes:[],day:TODAY},norm(d));closeSheet()}catch(e){bt.value='That doesn’t look like a backup. Paste it again.'}}

addEventListener('pagehide',()=>{flush();save()});addEventListener('resize',fitAll);
